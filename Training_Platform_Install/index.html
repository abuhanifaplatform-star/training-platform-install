<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075b58">
  <title>منصة التدريب</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/platform-icon-180.png">
  <link rel="icon" sizes="192x192" href="./icons/platform-icon-192.png">
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #183735; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; padding: 24px; display: grid; place-items: center; background: linear-gradient(150deg, #e1f3ee, #f8f6ed); }
    main { width: min(100%, 430px); padding: clamp(20px, 7vw, 36px); background: white; border: 1px solid #d6e8e0; border-radius: 24px; text-align: center; box-shadow: 0 16px 44px #12403b15; }
    img { display: block; width: min(100%, 250px); height: auto; margin: 0 auto 28px; }
    a { display: block; padding: 12px 20px; border-radius: 12px; background: #075b58; color: white; text-decoration: none; font-weight: 700; }
    a:focus-visible { outline: 3px solid #b28324; outline-offset: 3px; }
    section { margin-top: 24px; text-align: start; line-height: 1.7; }
    h1 { font-size: 1rem; margin: 0 0 8px; }
    p { font-size: .93rem; margin: 6px 0 0; }
    @media (display-mode: standalone) { .instructions { display: none; } }
  </style>
</head>
<body>
  <main aria-label="منصة التدريب">
    <img src="./platform-logo.png" alt="منصة التدريب — مدرسة الإمام أبي حنيفة الابتدائية والمتوسطة">
    <a href="https://script.google.com/macros/s/AKfycbzO618gORiXM27Fw3oUKzE5cr6mAoKBmzQjhbr_hIIUyh0uStBsqme7kssr8o11IH_xZg/exec">فتح المنصة</a>
    <section class="instructions" aria-labelledby="install">
      <h1 id="install">إضافة منصة التدريب إلى الشاشة الرئيسية</h1>
      <p><strong>آيفون:</strong> من Safari اضغط «مشاركة»، ثم «إضافة إلى الشاشة الرئيسية»، وفعّل «فتح كتطبيق ويب» إذا ظهر الخيار.</p>
      <p><strong>أندرويد:</strong> من قائمة Chrome اختر «إضافة إلى الشاشة الرئيسية»، ثم «تثبيت» عند ظهوره.</p>
    </section>
  </main>
</body>
</html>
